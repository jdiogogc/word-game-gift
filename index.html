<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>WORDLE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --ground: #B4B8BE;
      --card: #E4E6EA;
      --text: #1C1E22;
      --muted: #565B63;
      --hairline: #949AA3;
      --right: #4F6F5F;
      --near: #85704A;
      --miss: #9DA1A8;
      --accent: #4A5159;
      --tile-size: 3.25rem;
      --tile-gap: 0.35rem;
      --focus-ring: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent);
      --silver-shine: linear-gradient(180deg, #F2F3F5 0%, #D8DBE0 55%, #C4C8CE 100%);
      --silver-panel: linear-gradient(180deg, #ECEEF1 0%, #D5D9DE 100%);
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100svh;
      background:
        radial-gradient(circle at 20% 0%, rgba(255, 255, 255, 0.45), transparent 45%),
        radial-gradient(circle at 80% 100%, rgba(255, 255, 255, 0.2), transparent 40%),
        linear-gradient(165deg, #C8CBD0 0%, #AEB3BA 48%, #969BA3 100%);
      color: var(--text);
      font-family: "Archivo", system-ui, sans-serif;
    }

    body {
      padding:
        env(safe-area-inset-top)
        env(safe-area-inset-right)
        env(safe-area-inset-bottom)
        env(safe-area-inset-left);
    }

    .screen[hidden] { display: none !important; }

    .screen {
      position: relative;
      z-index: 1;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.25rem 1rem 1rem;
    }

    .card {
      background: var(--silver-panel);
      border: 1px solid var(--hairline);
      border-radius: 1rem;
      width: min(100%, 26rem);
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.55) inset;
    }

    /* Opening */
    #screen-opening {
      justify-content: center;
      text-align: center;
      gap: 2rem;
    }

    .opening-title {
      font-family: "Archivo", system-ui, sans-serif;
      font-size: clamp(2.75rem, 12vw, 4rem);
      font-weight: 700;
      letter-spacing: 0.18em;
      line-height: 1;
      margin: 0;
      color: #2A2E34;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.65);
    }

    .opening-sub {
      color: var(--muted);
      font-size: 1.05rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      line-height: 1.5;
      margin: 1rem 0 0;
    }

    /* Play */
    #screen-play {
      justify-content: space-between;
      gap: 0.75rem;
      width: 100%;
      max-width: 26rem;
      margin: 0 auto;
    }

    .play-header {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.65rem;
    }

    .progress {
      display: flex;
      gap: 0.45rem;
    }

    .pip {
      width: 2rem;
      height: 0.3rem;
      border-radius: 999px;
      background: var(--hairline);
    }

    .pip.is-done { background: var(--accent); opacity: 0.45; }
    .pip.is-active { background: var(--accent); opacity: 1; }

    .round-meta {
      color: var(--muted);
      font-size: 0.875rem;
    }

    .clue-wrap {
      width: 100%;
    }

    .clue {
      margin: 0;
      padding: 1rem 1.1rem;
      background: var(--silver-panel);
      border: 1px solid var(--hairline);
      border-radius: 0.75rem;
      font-size: 0.95rem;
      line-height: 1.45;
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.45) inset;
    }

    .play-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      gap: 0.5rem;
    }

    .board {
      --word-len: 5;
      display: flex;
      flex-direction: column;
      gap: var(--tile-gap);
      width: 100%;
      max-width: calc(var(--word-len) * var(--tile-size) + (var(--word-len) - 1) * var(--tile-gap));
    }

    .board--long { --tile-size: 2.65rem; }
    .board--extra-long { --tile-size: 2.25rem; }

    .board-row {
      display: grid;
      grid-template-columns: repeat(var(--word-len), 1fr);
      gap: var(--tile-gap);
    }

    .board-row.is-shaking {
      animation: shake 0.45s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }

    .tile {
      aspect-ratio: 1;
      border: 2px solid var(--hairline);
      border-radius: 0.35rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: calc(var(--tile-size) * 0.46);
      font-weight: 600;
      text-transform: uppercase;
      background: var(--silver-shine);
      color: var(--text);
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.5) inset;
      transition: background 0.18s ease, border-color 0.18s ease, color 0.18s ease, transform 0.18s ease;
    }

    .tile.is-filled { border-color: color-mix(in srgb, var(--text) 25%, var(--hairline)); }

    .tile.is-right,
    .tile.is-near,
    .tile.is-miss {
      border-color: transparent;
      color: #fff;
    }

    .tile.is-right { background: var(--right); }
    .tile.is-near { background: var(--near); }
    .tile.is-miss { background: var(--miss); }

    .tile.is-reveal {
      animation: tileFlip 0.35s ease forwards;
    }

    @keyframes tileFlip {
      0% { transform: scaleY(1); }
      50% { transform: scaleY(0); }
      100% { transform: scaleY(1); }
    }

    .length-hint {
      min-height: 1.25rem;
      margin: 0;
      font-size: 0.8rem;
      color: var(--muted);
      text-align: center;
    }

    .length-hint.is-visible { color: var(--accent); }

    /* Keyboard */
    .keyboard {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      touch-action: manipulation;
    }

    .kb-row {
      display: flex;
      justify-content: center;
      gap: 0.3rem;
    }

    .kb-key {
      min-height: 2.75rem;
      min-width: 2rem;
      flex: 1;
      max-width: 2.4rem;
      border: none;
      border-radius: 0.35rem;
      background: var(--silver-shine);
      border: 1px solid var(--hairline);
      color: var(--text);
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      touch-action: manipulation;
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.45) inset;
    }

    .kb-key--wide {
      flex: 1.4;
      max-width: 3.4rem;
      font-size: 0.72rem;
      font-weight: 500;
    }

    .kb-key.is-right { background: var(--right); border-color: var(--right); color: #fff; }
    .kb-key.is-near { background: var(--near); border-color: var(--near); color: #fff; }
    .kb-key.is-miss { background: var(--miss); border-color: var(--miss); color: #fff; }

    .kb-key:focus-visible,
    .btn:focus-visible {
      outline: none;
      box-shadow: var(--focus-ring);
    }

    /* Note */
    #screen-note {
      justify-content: center;
      gap: 1.5rem;
      text-align: center;
    }

    .note-word {
      display: flex;
      justify-content: center;
      gap: var(--tile-gap);
      flex-wrap: wrap;
    }

    .note-word .tile {
      width: var(--tile-size);
      height: var(--tile-size);
      font-size: calc(var(--tile-size) * 0.46);
    }

    .note-meta {
      color: var(--muted);
      font-size: 0.9rem;
      margin: 0;
    }

    .note-text {
      font-family: "Newsreader", Georgia, serif;
      font-size: clamp(1.25rem, 5vw, 1.55rem);
      line-height: 1.65;
      margin: 0;
      max-width: 22rem;
    }

    /* End */
    #screen-end {
      justify-content: flex-start;
      gap: 1.5rem;
      text-align: center;
    }

    .closing-title {
      font-family: "Newsreader", Georgia, serif;
      font-size: clamp(1.75rem, 6vw, 2.25rem);
      font-weight: 500;
      line-height: 1.2;
      margin: 0;
    }

    .closing-body {
      font-family: "Newsreader", Georgia, serif;
      font-size: clamp(1.1rem, 4.5vw, 1.35rem);
      line-height: 1.65;
      margin: 0;
      max-width: 22rem;
    }

    .closing-body + .closing-body { margin-top: 1rem; }

    .recap {
      width: min(100%, 22rem);
      text-align: left;
      margin: 0.5rem auto 0;
      padding: 0;
      list-style: none;
      border-top: 1px solid var(--hairline);
    }

    .recap li {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.75rem 0;
      border-bottom: 1px solid var(--hairline);
      font-size: 0.9rem;
    }

    .recap-word {
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    .recap-detail { color: var(--muted); }

    .btn {
      appearance: none;
      border: 1px solid #707780;
      border-radius: 999px;
      background: linear-gradient(180deg, #8A9098 0%, #5E656E 100%);
      color: #fff;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 500;
      padding: 0.85rem 1.75rem;
      cursor: pointer;
      touch-action: manipulation;
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.35) inset, 0 2px 6px rgba(28, 30, 34, 0.18);
    }

    @media (max-width: 360px) {
      :root { --tile-size: 2.85rem; }
      .board--long { --tile-size: 2.35rem; }
      .board--extra-long { --tile-size: 2rem; }
      .kb-key { min-height: 2.65rem; font-size: 0.8rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .board-row.is-shaking { animation: none; }
      .tile { transition: none; }
      .tile.is-reveal { animation: none; }
    }

    /* Phase 1 test output (hidden in normal play) */
    #test-output {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      max-height: 40vh;
      overflow: auto;
      background: #111;
      color: #0f0;
      font: 12px/1.4 monospace;
      padding: 0.5rem;
      white-space: pre-wrap;
      z-index: 9999;
    }

    #test-output[hidden] { display: none !important; }

    /* Edit */
    #screen-edit {
      justify-content: flex-start;
      gap: 1rem;
      width: 100%;
      max-width: 26rem;
      margin: 0 auto;
    }

    .edit-header {
      width: 100%;
      text-align: center;
    }

    .edit-title {
      font-family: "Newsreader", Georgia, serif;
      font-size: clamp(1.5rem, 5vw, 1.85rem);
      font-weight: 500;
      margin: 0;
    }

    .edit-sub {
      color: var(--muted);
      font-size: 0.875rem;
      margin: 0.5rem 0 0;
    }

    .edit-form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .edit-section {
      background: var(--silver-panel);
      border: 1px solid var(--hairline);
      border-radius: 0.75rem;
      padding: 1rem;
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.45) inset;
    }

    .edit-section-title {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin: 0 0 0.75rem;
    }

    .edit-field {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      margin-bottom: 0.75rem;
    }

    .edit-field:last-child { margin-bottom: 0; }

    .edit-label {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text);
    }

    .edit-input,
    .edit-textarea {
      width: 100%;
      padding: 0.6rem 0.75rem;
      border: 1px solid var(--hairline);
      border-radius: 0.5rem;
      font-family: inherit;
      font-size: 0.9rem;
      color: var(--text);
      background: var(--silver-shine);
    }

    .edit-input:focus,
    .edit-textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: var(--focus-ring);
    }

    .edit-textarea {
      resize: vertical;
      min-height: 3.5rem;
      line-height: 1.45;
    }

    .edit-input--word {
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    .edit-actions {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      width: 100%;
      padding-bottom: 0.5rem;
    }

    .btn--ghost {
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--hairline);
    }

    .btn--text {
      background: transparent;
      color: var(--muted);
      font-size: 0.85rem;
      padding: 0.5rem;
    }

    .edit-error {
      color: #9b2c2c;
      font-size: 0.85rem;
      margin: 0;
      text-align: center;
    }

    .opening-actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
    }

    .round-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-size: cover;
      background-position: center;
      opacity: 0;
      transition: opacity 0.35s ease;
    }

    .round-bg.is-visible { opacity: 1; }

    .round-bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(180, 184, 190, 0.62);
    }

    .edit-image-field {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      margin-bottom: 0.75rem;
    }

    .edit-image-preview {
      width: 100%;
      max-height: 9rem;
      object-fit: cover;
      border-radius: 0.5rem;
      border: 1px solid var(--hairline);
      background: var(--silver-shine);
    }

    .edit-image-preview[hidden] { display: none !important; }

    .edit-image-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .edit-file-input {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .edit-file-label {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.55rem 0.9rem;
      border-radius: 999px;
      border: 1px solid var(--hairline);
      background: var(--silver-shine);
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
    }

    .edit-file-label:focus-within {
      outline: none;
      box-shadow: var(--focus-ring);
    }

    .edit-image-remove {
      appearance: none;
      border: 1px solid var(--hairline);
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      font-family: inherit;
      font-size: 0.85rem;
      padding: 0.55rem 0.9rem;
      cursor: pointer;
    }

    .edit-section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
    }

    .edit-section-header .edit-section-title {
      margin: 0;
    }

    .edit-round-remove {
      appearance: none;
      border: none;
      background: transparent;
      color: var(--muted);
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 500;
      padding: 0.25rem 0;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .edit-round-remove:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      text-decoration: none;
    }

    .edit-add-round {
      width: 100%;
    }
  </style>
</head>
<body>

  <div id="round-bg" class="round-bg" aria-hidden="true" hidden></div>

  <!-- Opening -->
  <section id="screen-opening" class="screen">
    <div>
      <h1 class="opening-title">WORDLE</h1>
      <p class="opening-sub">Tinyversary Edition</p>
    </div>
    <div class="opening-actions">
      <button type="button" class="btn" id="btn-start">Start</button>
      <button type="button" class="btn btn--text" id="btn-edit">Edit words &amp; messages</button>
    </div>
  </section>

  <!-- Play -->
  <section id="screen-play" class="screen" hidden>
    <header class="play-header">
      <div class="progress" id="progress" aria-hidden="true"></div>
      <p class="round-meta" id="round-meta"></p>
    </header>

    <div class="clue-wrap">
      <p class="clue" id="clue"></p>
    </div>

    <div class="play-main">
      <div class="board" id="board" aria-label="Guess board"></div>
      <p class="length-hint" id="length-hint" aria-live="polite"></p>
    </div>

    <div class="keyboard" id="keyboard" aria-label="On-screen keyboard"></div>
  </section>

  <!-- Note -->
  <section id="screen-note" class="screen" hidden>
    <div class="note-word" id="note-word" aria-hidden="true"></div>
    <p class="note-meta" id="note-meta"></p>
    <p class="note-text" id="note-text"></p>
    <button type="button" class="btn" id="btn-next">Next</button>
  </section>

  <!-- Edit -->
  <section id="screen-edit" class="screen" hidden>
    <header class="edit-header">
      <h2 class="edit-title">Edit content</h2>
      <p class="edit-sub">Words, photos, and messages are saved on this device.</p>
    </header>

    <form class="edit-form" id="edit-form" novalidate>
      <div id="edit-rounds"></div>

      <button type="button" class="btn btn--ghost edit-add-round" id="btn-add-round">Add another word</button>

      <div class="edit-section">
        <h3 class="edit-section-title">Last message</h3>
        <div class="edit-field">
          <label class="edit-label" for="edit-closing-title">Title</label>
          <input class="edit-input" type="text" id="edit-closing-title" autocomplete="off">
        </div>
        <div class="edit-field">
          <label class="edit-label" for="edit-closing-body">Message</label>
          <textarea class="edit-textarea" id="edit-closing-body" rows="4" placeholder="Separate paragraphs with a blank line"></textarea>
        </div>
      </div>

      <p class="edit-error" id="edit-error" hidden></p>

      <div class="edit-actions">
        <button type="submit" class="btn">Save changes</button>
        <button type="button" class="btn btn--ghost" id="btn-edit-back">Back</button>
        <button type="button" class="btn btn--text" id="btn-edit-reset">Reset to defaults</button>
      </div>
    </form>
  </section>

  <!-- End -->
  <section id="screen-end" class="screen" hidden>
    <h2 class="closing-title" id="closing-title"></h2>
    <div id="closing-body"></div>
    <ul class="recap" id="recap"></ul>
  </section>

  <pre id="test-output" hidden></pre>

  <script>
    // ─── Content defaults ───
    const DEFAULT_ROUNDS = [
      { answer: "BRAVE", clue: "What you were on the day we met.", note: "You walked in like you already belonged there." },
      { answer: "PARIS", clue: "Where we got lost on purpose.", note: "Every wrong turn was the right one that week." },
      { answer: "FOUR", clue: "How many years we've been at this.", note: "Still counting, still choosing each other." },
      { answer: "MUSIC", clue: "The thing playing when you said yes.", note: "I hear that song differently now." },
      { answer: "HOME", clue: "What you are to me.", note: "" },
    ];

    const DEFAULT_CLOSING = {
      title: "Thank you for playing",
      body: [
        "These five words barely cover it, but they were the ones I kept coming back to.",
        "Here's to many more rounds — the easy ones and the hard ones — together.",
      ],
    };

    const STORAGE_KEY = "five-words-content";
    const GUESSES = 6;

    // ─── Game logic ───

    const RESULT_RANK = { miss: 0, near: 1, right: 2 };

    function normalizeWord(word) {
      return String(word).toUpperCase().replace(/[^A-Z]/g, "");
    }

    function cloneContent(rounds, closing) {
      return {
        rounds: rounds.map((r) => ({
          answer: r.answer,
          clue: r.clue,
          note: r.note,
          backgroundImage: r.backgroundImage || "",
        })),
        closing: {
          title: closing.title,
          body: [...closing.body],
        },
      };
    }

    function normalizeRounds(rounds) {
      return rounds.map((round) => ({
        ...round,
        answer: normalizeWord(round.answer),
      }));
    }

    function loadContent() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return cloneContent(DEFAULT_ROUNDS, DEFAULT_CLOSING);
        const saved = JSON.parse(raw);
        if (!Array.isArray(saved.rounds) || !saved.closing) {
          return cloneContent(DEFAULT_ROUNDS, DEFAULT_CLOSING);
        }
        return {
          rounds: normalizeRounds(saved.rounds).map((round, i) => ({
            ...round,
            backgroundImage: String(saved.rounds[i]?.backgroundImage || ""),
          })),
          closing: {
            title: String(saved.closing.title || DEFAULT_CLOSING.title),
            body: Array.isArray(saved.closing.body) && saved.closing.body.length
              ? saved.closing.body.map(String)
              : [...DEFAULT_CLOSING.body],
          },
        };
      } catch {
        return cloneContent(DEFAULT_ROUNDS, DEFAULT_CLOSING);
      }
    }

    function saveContent(rounds, closing) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ rounds, closing }));
      } catch (err) {
        if (err && (err.name === "QuotaExceededError" || err.code === 22)) {
          throw new Error("Storage is full. Try smaller photos or remove some background images.");
        }
        throw err;
      }
    }

    const MAX_IMAGE_BYTES = 450000;
    const MAX_IMAGE_DIMENSION = 1400;

    function loadImageFromFile(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(new Error("Could not read that image."));
        reader.readAsDataURL(file);
      });
    }

    function loadImageElement(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error("Could not load that image."));
        img.src = src;
      });
    }

    function canvasToBlob(canvas, type, quality) {
      return new Promise((resolve) => {
        canvas.toBlob((blob) => resolve(blob), type, quality);
      });
    }

    async function compressImageFile(file) {
      if (!file.type.startsWith("image/")) {
        throw new Error("Please choose a photo from your gallery.");
      }

      const dataUrl = await loadImageFromFile(file);
      const img = await loadImageElement(dataUrl);
      const scale = Math.min(1, MAX_IMAGE_DIMENSION / Math.max(img.width, img.height));
      const width = Math.max(1, Math.round(img.width * scale));
      const height = Math.max(1, Math.round(img.height * scale));
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, width, height);

      let quality = 0.88;
      let blob = await canvasToBlob(canvas, "image/jpeg", quality);

      while (blob && blob.size > MAX_IMAGE_BYTES && quality > 0.45) {
        quality -= 0.08;
        blob = await canvasToBlob(canvas, "image/jpeg", quality);
      }

      if (!blob) {
        throw new Error("Could not process that image.");
      }

      if (blob.size > MAX_IMAGE_BYTES) {
        throw new Error("That photo is too large. Try a smaller image from your gallery.");
      }

      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(new Error("Could not save that image."));
        reader.readAsDataURL(blob);
      });
    }

    let content = loadContent();
    let ROUNDS = content.rounds;
    let CLOSING = content.closing;

    function scoreGuess(guess, answer) {
      const len = answer.length;
      const results = new Array(len);
      const remaining = [];

      for (let i = 0; i < len; i += 1) {
        if (guess[i] === answer[i]) {
          results[i] = "right";
        } else {
          remaining.push(answer[i]);
        }
      }

      for (let i = 0; i < len; i += 1) {
        if (results[i]) continue;
        const letter = guess[i];
        const poolIndex = remaining.indexOf(letter);
        if (poolIndex !== -1) {
          results[i] = "near";
          remaining.splice(poolIndex, 1);
        } else {
          results[i] = "miss";
        }
      }

      return results;
    }

    function arraysEqual(a, b) {
      return a.length === b.length && a.every((v, i) => v === b[i]);
    }

    function runTests() {
      const cases = [
        {
          name: "SPEED vs ERASE (duplicate near)",
          guess: "SPEED",
          answer: "ERASE",
          expected: ["near", "miss", "near", "near", "miss"],
        },
        {
          name: "ALLEY vs LABEL (classic dupes)",
          guess: "ALLEY",
          answer: "LABEL",
          expected: ["near", "near", "near", "right", "miss"],
        },
        {
          name: "ABBEY vs BOBBY (repeated answer letter)",
          guess: "ABBEY",
          answer: "BOBBY",
          expected: ["miss", "near", "right", "miss", "right"],
        },
      ];

      const lines = [];
      let passed = 0;

      cases.forEach(({ name, guess, answer, expected }) => {
        const result = scoreGuess(guess, answer);
        const ok = arraysEqual(result, expected) && result.length === answer.length;
        if (ok) passed += 1;
        lines.push(`${ok ? "PASS" : "FAIL"}  ${name}`);
        lines.push(`  guess:    ${guess}`);
        lines.push(`  answer:   ${answer}`);
        lines.push(`  expected: ${expected.join(", ")}`);
        lines.push(`  got:      ${result.join(", ")}`);
        lines.push("");
      });

      const normOk = normalizeWord("  hello-World!  ") === "HELLOWORLD";
      lines.push(`${normOk ? "PASS" : "FAIL"}  normalizeWord strips non-letters and uppercases`);
      if (normOk) passed += 1;

      lines.unshift(`Scoring tests: ${passed}/${cases.length + 1} passed\n`);
      return { lines, passed, total: cases.length + 1 };
    }

    // ─── DOM refs ───

    };

      btnEdit: document.getElementById("btn-edit"),
      btnEditBack: document.getElementById("btn-edit-back"),
      btnEditReset: document.getElementById("btn-edit-reset"),
      btnAddRound: document.getElementById("btn-add-round"),
      editForm: document.getElementById("edit-form"),
      editRounds: document.getElementById("edit-rounds"),
      editClosingTitle: document.getElementById("edit-closing-title"),
      editClosingBody: document.getElementById("edit-closing-body"),
      editError: document.getElementById("edit-error"),
      btnNext: document.getElementById("btn-next"),
      progress: document.getElementById("progress"),
      roundMeta: document.getElementById("round-meta"),
      clue: document.getElementById("clue"),
      board: document.getElementById("board"),
      lengthHint: document.getElementById("length-hint"),
      keyboard: document.getElementById("keyboard"),
      noteWord: document.getElementById("note-word"),
      noteMeta: document.getElementById("note-meta"),
      noteText: document.getElementById("note-text"),
      closingTitle: document.getElementById("closing-title"),
      closingBody: document.getElementById("closing-body"),

      testOutput: document.getElementById("test-output"),

    };

    let editImages = [];
    let editDraftRounds = [];
    const MAX_ROUNDS = 10;

    const KB_ROWS = [
      ["Q", "W", "E", "R", "T", "Y", "U", "I", "O", "P"],
      ["A", "S", "D", "F", "G", "H", "J", "K", "L"],
      ["Enter", "Z", "X", "C", "V", "B", "N", "M", "⌫"],
    ];

    let roundIndex = 0;
    let guessCount = 0;
    let currentGuess = "";
    let keyStates = {};
    let recap = [];
    let roundEnding = false;
    let lastRoundWasRevealed = false;

    function setRoundBackground(imageUrl) {
      if (!imageUrl) {
        clearRoundBackground();
        return;
      }
      els.roundBg.style.backgroundImage = `url("${imageUrl.replace(/"/g, "%22")}")`;
      els.roundBg.hidden = false;
      requestAnimationFrame(() => els.roundBg.classList.add("is-visible"));
    }

    function clearRoundBackground() {
      els.roundBg.classList.remove("is-visible");
      els.roundBg.hidden = true;
      els.roundBg.style.backgroundImage = "";
    }

    function showScreen(name) {
      Object.values(screens).forEach((el) => { el.hidden = true; });
      screens[name].hidden = false;
      if (name !== "play" && name !== "note") {
        clearRoundBackground();
      }
    }

    function currentRound() {
      return ROUNDS[roundIndex];
    }

    function answerLength() {
      return currentRound().answer.length;
    }

    function buildProgress() {
      els.progress.innerHTML = "";
      ROUNDS.forEach((_, i) => {
        const pip = document.createElement("span");
        pip.className = "pip";
        if (i < roundIndex) pip.classList.add("is-done");
        if (i === roundIndex) pip.classList.add("is-active");
        els.progress.appendChild(pip);
      });
    }

    function boardSizeClass(len) {
      if (len >= 7) return "board--extra-long";
      if (len >= 6) return "board--long";
      return "";
    }

    function buildBoard() {
      const len = answerLength();
      els.board.style.setProperty("--word-len", len);
      els.board.className = "board " + boardSizeClass(len);
      els.board.innerHTML = "";

      for (let r = 0; r < GUESSES; r += 1) {
        const row = document.createElement("div");
        row.className = "board-row";
        row.dataset.row = r;
        for (let c = 0; c < len; c += 1) {
          const tile = document.createElement("div");
          tile.className = "tile";
          tile.dataset.col = c;
          row.appendChild(tile);
        }
        els.board.appendChild(row);
      }
    }

    function buildKeyboard() {
      els.keyboard.innerHTML = "";
      KB_ROWS.forEach((row) => {
        const rowEl = document.createElement("div");
        rowEl.className = "kb-row";
        row.forEach((key) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "kb-key";
          btn.textContent = key === "Enter" ? "Enter" : key;
          btn.dataset.key = key;
          if (key === "Enter" || key === "⌫") btn.classList.add("kb-key--wide");
          btn.addEventListener("click", () => handleKeyPress(key));
          rowEl.appendChild(btn);
        });
        els.keyboard.appendChild(rowEl);
      });
    }

    function resetKeyStates() {
      keyStates = {};
      els.keyboard.querySelectorAll(".kb-key").forEach((btn) => {
        btn.classList.remove("is-right", "is-near", "is-miss");
      });
    }

    function updateKeyState(letter, result) {
      const prev = keyStates[letter];
      if (prev && RESULT_RANK[prev] >= RESULT_RANK[result]) return;
      keyStates[letter] = result;
      const btn = els.keyboard.querySelector(`.kb-key[data-key="${letter}"]`);
      if (!btn) return;
      btn.classList.remove("is-right", "is-near", "is-miss");
      btn.classList.add(`is-${result}`);
    }

    function getRowEl(index) {
      return els.board.querySelector(`.board-row[data-row="${index}"]`);
    }

    function renderCurrentRow() {
      const row = getRowEl(guessCount);
      if (!row) return;
      const tiles = row.querySelectorAll(".tile");
      tiles.forEach((tile, i) => {
        const letter = currentGuess[i] || "";
        tile.textContent = letter;
        tile.classList.toggle("is-filled", Boolean(letter));
        tile.classList.remove("is-right", "is-near", "is-miss", "is-reveal");
      });
    }

    function clearLengthHint() {
      els.lengthHint.textContent = "";
      els.lengthHint.classList.remove("is-visible");
    }

    function showLengthHint() {
      const len = answerLength();
      els.lengthHint.textContent = `${len} letters required`;
      els.lengthHint.classList.add("is-visible");
      const row = getRowEl(guessCount);
      if (row) {
        row.classList.remove("is-shaking");
        void row.offsetWidth;
        row.classList.add("is-shaking");
      }
    }

    function paintRow(rowEl, guess, results, animate) {
      const tiles = rowEl.querySelectorAll(".tile");
      const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      tiles.forEach((tile, i) => {
        tile.textContent = guess[i];
        tile.classList.add("is-filled");
        tile.classList.remove("is-right", "is-near", "is-miss", "is-reveal");

        const apply = () => {
          tile.classList.add(`is-${results[i]}`);
        };

        if (animate && !reduced) {
          tile.style.transitionDelay = `${i * 90}ms`;
          tile.classList.add("is-reveal");
          setTimeout(apply, i * 90 + 120);
        } else {
          tile.style.transitionDelay = "0ms";
          apply();
        }
      });
    }

    function handleKeyPress(key) {
      if (roundEnding) return;
      const len = answerLength();

      if (key === "⌫") {
        currentGuess = currentGuess.slice(0, -1);
        clearLengthHint();
        renderCurrentRow();
        return;
      }

      if (key === "Enter") {
        submitGuess();
        return;
      }

      if (/^[A-Z]$/.test(key) && currentGuess.length < len) {
        currentGuess += key;
        clearLengthHint();
        renderCurrentRow();
      }
    }

    function submitGuess() {
      const round = currentRound();
      const len = round.answer.length;

      if (currentGuess.length < len) {
        showLengthHint();
        return;
      }

      clearLengthHint();
      const results = scoreGuess(currentGuess, round.answer);
      const row = getRowEl(guessCount);

      results.forEach((res, i) => updateKeyState(currentGuess[i], res));

      const solved = currentGuess === round.answer;
      const isLastGuess = guessCount + 1 >= GUESSES;
      roundEnding = solved || isLastGuess;

      paintRow(row, currentGuess, results, roundEnding);

      if (roundEnding) {
        lastRoundWasRevealed = !solved;
        const delay = window.matchMedia("(prefers-reduced-motion: reduce)").matches
          ? 100
          : len * 90 + 450;

        setTimeout(() => finishRound(solved), delay);
      } else {
        guessCount += 1;
        currentGuess = "";
      }
    }

    function finishRound(solved) {
      const round = currentRound();
      const count = solved ? guessCount + 1 : GUESSES;

      recap.push({
        word: round.answer,
        guessCount: count,
        wasRevealed: !solved,
      });

      showNoteScreen(round, count, solved);
      roundEnding = false;
    }

    function showNoteScreen(round, count, solved) {
      const len = round.answer.length;
      const tileSize = len >= 7 ? "2.25rem" : len >= 6 ? "2.65rem" : "3.25rem";
      els.noteWord.style.setProperty("--tile-size", tileSize);
      els.noteWord.innerHTML = "";

      const displayWord = solved ? currentGuess : round.answer;
      const displayResults = solved
        ? scoreGuess(displayWord, round.answer)
        : new Array(len).fill("right");

      displayWord.split("").forEach((letter, i) => {
        const tile = document.createElement("div");
        tile.className = `tile is-${displayResults[i]}`;
        tile.textContent = letter;
        els.noteWord.appendChild(tile);
      });

      if (solved) {
        els.noteMeta.textContent = count === 1 ? "1 guess" : `${count} guesses`;
      } else {
        els.noteMeta.textContent = "Revealed after 6 guesses";
      }

      if (round.note) {
        els.noteText.textContent = round.note;
        els.noteText.hidden = false;
      } else {
        els.noteText.textContent = "";
        els.noteText.hidden = true;
      }

      setRoundBackground(round.backgroundImage);
      showScreen("note");
    }

    function startRound() {
      const round = currentRound();
      guessCount = 0;
      currentGuess = "";
      roundEnding = false;
      lastRoundWasRevealed = false;
      clearLengthHint();
      resetKeyStates();
      buildProgress();
      buildBoard();
      els.roundMeta.textContent = `Round ${roundIndex + 1} · ${round.answer.length} letters`;
      els.clue.textContent = round.clue;
      setRoundBackground(round.backgroundImage);
      renderCurrentRow();
      showScreen("play");
    }

    function startGame() {
      roundIndex = 0;
      recap = [];
      startRound();
    }

    function showEndScreen() {
      els.closingTitle.textContent = CLOSING.title;
      els.closingBody.innerHTML = "";
      CLOSING.body.forEach((paragraph) => {
        const p = document.createElement("p");
        p.className = "closing-body";
        p.textContent = paragraph;
        els.closingBody.appendChild(p);
      });

      els.recap.innerHTML = "";
      recap.forEach((entry) => {
        const li = document.createElement("li");
        const detail = entry.wasRevealed
          ? "Revealed"
          : entry.guessCount === 1
            ? "1 guess"
            : `${entry.guessCount} guesses`;
        li.innerHTML = `<span class="recap-word">${entry.word}</span><span class="recap-detail">${detail}</span>`;
        els.recap.appendChild(li);
      });

      showScreen("end");
    }

    function nextFromNote() {
      const round = currentRound();
      const isLastRound = roundIndex >= ROUNDS.length - 1;

      if (isLastRound && !round.note) {
        showEndScreen();
        return;
      }

      if (isLastRound) {
        showEndScreen();
        return;
      }

      roundIndex += 1;
      startRound();
    }

    function bodyToTextarea(body) {
      return body.join("\n\n");
    }

    function textareaToBody(text) {
      return text
        .split(/\n\s*\n/)
        .map((p) => p.trim())
        .filter(Boolean);
    }

    function addEditField(parent, labelText, inputEl) {
      const field = document.createElement("div");
      field.className = "edit-field";
      const label = document.createElement("label");
      label.className = "edit-label";
      label.htmlFor = inputEl.id;
      label.textContent = labelText;
      field.append(label, inputEl);
      parent.appendChild(field);
    }

    function updateEditImagePreview(i) {
      const preview = document.getElementById(`edit-image-preview-${i}`);
      const removeBtn = document.getElementById(`edit-image-remove-${i}`);
      if (!preview || !removeBtn) return;
      const imageUrl = editImages[i];
      if (imageUrl) {
        preview.src = imageUrl;
        preview.hidden = false;
        removeBtn.hidden = false;
      } else {
        preview.removeAttribute("src");
        preview.hidden = true;
        removeBtn.hidden = true;
      }
    }

    async function handleImageUpload(i, file) {
      if (!file) return;
      try {
        els.editError.hidden = true;
        editImages[i] = await compressImageFile(file);
        updateEditImagePreview(i);
      } catch (err) {
        showEditError(err.message || "Could not add that photo.");
      }
    }

    function syncEditDraftFromForm() {
      editDraftRounds = editDraftRounds.map((_, i) => {
        const answerEl = document.getElementById(`edit-answer-${i}`);
        const clueEl = document.getElementById(`edit-clue-${i}`);
        const noteEl = document.getElementById(`edit-note-${i}`);
        if (!answerEl || !clueEl || !noteEl) {
          return {
            ...editDraftRounds[i],
            backgroundImage: editImages[i] || "",
          };
        }
        return {
          answer: normalizeWord(answerEl.value),
          clue: clueEl.value.trim(),
          note: noteEl.value.trim(),
          backgroundImage: editImages[i] || "",
        };
      });
    }

    function removeEditRound(index) {
      if (editDraftRounds.length <= 1) return;
      syncEditDraftFromForm();
      editDraftRounds.splice(index, 1);
      editImages.splice(index, 1);
      buildEditForm();
    }

    function addEditRound() {
      syncEditDraftFromForm();
      if (editDraftRounds.length >= MAX_ROUNDS) {
        showEditError(`You can add up to ${MAX_ROUNDS} words.`);
        return;
      }
      editDraftRounds.push({ answer: "", clue: "", note: "", backgroundImage: "" });
      editImages.push("");
      els.editError.hidden = true;
      buildEditForm();
    }

    function buildEditForm() {
      els.editRounds.innerHTML = "";
      editDraftRounds.forEach((round, i) => {
        const section = document.createElement("div");
        section.className = "edit-section";

        const header = document.createElement("div");
        header.className = "edit-section-header";

        const heading = document.createElement("h3");
        heading.className = "edit-section-title";
        heading.textContent = `Round ${i + 1}`;
        header.appendChild(heading);

        const removeRoundBtn = document.createElement("button");
        removeRoundBtn.type = "button";
        removeRoundBtn.className = "edit-round-remove";
        removeRoundBtn.textContent = "Remove";
        removeRoundBtn.disabled = editDraftRounds.length <= 1;
        removeRoundBtn.addEventListener("click", () => removeEditRound(i));
        header.appendChild(removeRoundBtn);

        section.appendChild(header);

        const answer = document.createElement("input");
        answer.className = "edit-input edit-input--word";
        answer.type = "text";
        answer.id = `edit-answer-${i}`;
        answer.autocomplete = "off";
        answer.value = round.answer;
        addEditField(section, "Word", answer);

        const clue = document.createElement("input");
        clue.className = "edit-input";
        clue.type = "text";
        clue.id = `edit-clue-${i}`;
        clue.autocomplete = "off";
        clue.value = round.clue;
        addEditField(section, "Description", clue);

        const note = document.createElement("textarea");
        note.className = "edit-textarea";
        note.id = `edit-note-${i}`;
        note.rows = 2;
        note.value = round.note;
        addEditField(section, "Note after round (optional)", note);

        const imageField = document.createElement("div");
        imageField.className = "edit-image-field";

        const imageLabel = document.createElement("span");
        imageLabel.className = "edit-label";
        imageLabel.textContent = "Background photo (optional)";
        imageField.appendChild(imageLabel);

        const preview = document.createElement("img");
        preview.className = "edit-image-preview";
        preview.id = `edit-image-preview-${i}`;
        preview.alt = "";
        preview.hidden = true;
        imageField.appendChild(preview);

        const actions = document.createElement("div");
        actions.className = "edit-image-actions";

        const fileLabel = document.createElement("label");
        fileLabel.className = "edit-file-label";
        fileLabel.htmlFor = `edit-image-${i}`;
        fileLabel.textContent = "Choose from gallery";

        const fileInput = document.createElement("input");
        fileInput.className = "edit-file-input";
        fileInput.type = "file";
        fileInput.id = `edit-image-${i}`;
        fileInput.accept = "image/*";
        fileInput.addEventListener("change", () => {
          const [file] = fileInput.files;
          fileInput.value = "";
          handleImageUpload(i, file);
        });

        fileLabel.appendChild(fileInput);
        actions.appendChild(fileLabel);

        const removeBtn = document.createElement("button");
        removeBtn.type = "button";
        removeBtn.className = "edit-image-remove";
        removeBtn.id = `edit-image-remove-${i}`;
        removeBtn.textContent = "Remove photo";
        removeBtn.hidden = true;
        removeBtn.addEventListener("click", () => {
          editImages[i] = "";
          updateEditImagePreview(i);
        });
        actions.appendChild(removeBtn);

        imageField.appendChild(actions);
        section.appendChild(imageField);

        els.editRounds.appendChild(section);
        updateEditImagePreview(i);
      });

      els.editClosingTitle.value = CLOSING.title;
      els.editClosingBody.value = bodyToTextarea(CLOSING.body);
      els.btnAddRound.disabled = editDraftRounds.length >= MAX_ROUNDS;
      els.editError.hidden = true;
      els.editError.textContent = "";
    }

    function showEditError(message) {
      els.editError.textContent = message;
      els.editError.hidden = false;
    }

    function openEditScreen() {
      editDraftRounds = ROUNDS.map((round) => ({
        answer: round.answer,
        clue: round.clue,
        note: round.note,
        backgroundImage: round.backgroundImage || "",
      }));
      editImages = editDraftRounds.map((round) => round.backgroundImage || "");
      buildEditForm();
      showScreen("edit");
    }

    function applyContent(nextRounds, nextClosing) {
      content = { rounds: nextRounds, closing: nextClosing };
      ROUNDS = content.rounds;
      CLOSING = content.closing;
    }

    function readEditForm() {
      syncEditDraftFromForm();
      const rounds = editDraftRounds.map((round, i) => ({
        answer: round.answer,
        clue: round.clue,
        note: round.note,
        backgroundImage: editImages[i] || "",
      }));

      const closing = {
        title: els.editClosingTitle.value.trim(),
        body: textareaToBody(els.editClosingBody.value),
      };

      return { rounds, closing };
    }

    function validateContent({ rounds, closing }) {
      if (!rounds.length) {
        return "Add at least one word.";
      }
      for (let i = 0; i < rounds.length; i += 1) {
        const { answer, clue } = rounds[i];
        if (!answer || answer.length < 2) {
          return `Round ${i + 1}: enter a word with at least 2 letters.`;
        }
        if (answer.length > 10) {
          return `Round ${i + 1}: words can be at most 10 letters.`;
        }
        if (!clue) {
          return `Round ${i + 1}: add a description.`;
        }
      }
      if (!closing.title) {
        return "Add a title for the last message.";
      }
      if (!closing.body.length) {
        return "Add at least one paragraph for the last message.";
      }
      return null;
    }

    function handleEditSave(e) {
      e.preventDefault();
      const next = readEditForm();
      const error = validateContent(next);
      if (error) {
        showEditError(error);
        return;
      }
      try {
        saveContent(next.rounds, next.closing);
      } catch (err) {
        showEditError(err.message || "Could not save your changes.");
        return;
      }
      applyContent(next.rounds, next.closing);
      showScreen("opening");
    }

    function handleEditReset() {
      if (!window.confirm("Reset all words and messages to the original defaults?")) return;
      localStorage.removeItem(STORAGE_KEY);
      applyContent(
        normalizeRounds(cloneContent(DEFAULT_ROUNDS, DEFAULT_CLOSING).rounds),
        cloneContent(DEFAULT_ROUNDS, DEFAULT_CLOSING).closing,
      );
      editDraftRounds = ROUNDS.map((round) => ({
        answer: round.answer,
        clue: round.clue,
        note: round.note,
        backgroundImage: round.backgroundImage || "",
      }));
      editImages = editDraftRounds.map((round) => round.backgroundImage || "");
      buildEditForm();
    }

    // ─── Init ───
    els.btnStart.addEventListener("click", startGame);
    els.btnEdit.addEventListener("click", openEditScreen);
    els.btnEditBack.addEventListener("click", () => showScreen("opening"));
    els.btnEditReset.addEventListener("click", handleEditReset);
    els.btnAddRound.addEventListener("click", addEditRound);
    els.editForm.addEventListener("submit", handleEditSave);
    els.btnNext.addEventListener("click", nextFromNote);
    buildKeyboard();

    document.addEventListener("keydown", (e) => {
      if (screens.play.hidden) return;
      if (e.ctrlKey || e.metaKey || e.altKey) return;

      if (e.key === "Enter") {
        e.preventDefault();
        handleKeyPress("Enter");
      } else if (e.key === "Backspace") {
        e.preventDefault();
        handleKeyPress("⌫");
      } else if (/^[a-zA-Z]$/.test(e.key)) {
        e.preventDefault();
        handleKeyPress(e.key.toUpperCase());
      }
    });

    const testResult = runTests();
    console.log(testResult.lines.join("\n"));

    const urlParams = new URLSearchParams(location.search);
    if (urlParams.has("test")) {
      els.testOutput.hidden = false;
      els.testOutput.textContent = testResult.lines.join("\n");
    }
    if (urlParams.has("edit")) {
      openEditScreen();
    }
  </script>
</body>
</html>
